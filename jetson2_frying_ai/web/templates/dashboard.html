<!DOCTYPE html>
<html lang="ko">
<head>
    <title>튀김 AI 모니터</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <div class="title-block">
            <span class="title-mark"></span>
            <h1>튀김 AI 모니터</h1>
            <span class="device-label" id="device-label" hidden></span>
        </div>
        <div class="chips">
            <span class="chip" id="chip-mqtt">MQTT -</span>
            <span class="chip" id="chip-disk">Disk -</span>
            <span class="chip chip-plain" id="chip-updated">-</span>
            <a class="chip" href="/settings" style="text-decoration:none;color:inherit;">⚙ 설정</a>
        </div>
    </header>

    <div class="alert" id="stall-alert" hidden>
        <span class="alert-text" id="stall-alert-text">-</span>
        <span class="alert-actions" id="alert-actions">
            <button class="btn btn-danger" onclick="recoveryStart('reset')">칩 리셋</button>
            <button class="btn" onclick="recoveryStart('reset-skip-relay')">칩 리셋 (릴레이 무시)</button>
        </span>
        <span class="recovery-status" id="alert-recovery-status"></span>
    </div>

    <div class="status-line" id="status-bar">Loading...</div>

    <main class="grid">
        <div class="camera-box">
            <div class="cam-header"><span>튀김 좌 (POT0)</span><span class="pill" id="pill-0">-</span></div>
            <img src="/mjpeg/cam0" alt="Frying Left">
            <div class="cam-status" id="status-0">-</div>
        </div>

        <div class="camera-box">
            <div class="cam-header"><span>튀김 우 (POT1)</span><span class="pill" id="pill-1">-</span></div>
            <img src="/mjpeg/cam1" alt="Frying Right">
            <div class="cam-status" id="status-1">-</div>
        </div>

        <div class="camera-box">
            <div class="cam-header"><span>바켓 좌</span><span class="pill" id="pill-2">-</span></div>
            <img src="/mjpeg/cam2" alt="Bucket Left">
            <div class="cam-status" id="status-2">-</div>
        </div>

        <div class="camera-box">
            <div class="cam-header"><span>바켓 우</span><span class="pill" id="pill-3">-</span></div>
            <img src="/mjpeg/cam3" alt="Bucket Right">
            <div class="cam-status" id="status-3">-</div>
        </div>
    </main>

    <section class="panel">
        <div class="section-label">제어</div>
        <div class="control-panel">
            <div class="control-group control-group-key">
                <div class="control-title">카메라 복구 <span id="auto-recovery-status" class="recovery-status"></span></div>
                <div class="control-buttons">
                    <button class="btn" onclick="recoveryStart('relay-status')">릴레이 상태</button>
                    <button class="btn btn-danger" onclick="recoveryStart('reset')">칩 리셋</button>
                    <button class="btn btn-danger" onclick="recoveryStart('reset-skip-relay')">칩 리셋 (릴레이 무시)</button>
                    <button class="btn" onclick="toggleRecoveryLog()">Log</button>
                    <span id="recovery-status" class="recovery-status">-</span>
                </div>
            </div>
            <div class="recovery-log-box" id="recovery-log" style="display:none;">
                <pre class="log-list recovery-log-text" id="recovery-log-text">-</pre>
            </div>
            <div class="control-group">
                <div class="control-title">Relay</div>
                <div class="control-buttons">
                    <button class="btn" onclick="relayControl('on')">ON</button>
                    <button class="btn" onclick="relayControl('off')">OFF</button>
                </div>
            </div>
            <div class="control-group">
                <div class="control-title">Vibration</div>
                <div class="control-buttons">
                    <button class="btn" onclick="vibrationControl('start')">START</button>
                    <button class="btn" onclick="vibrationControl('stop')">STOP</button>
                    <button class="btn" onclick="vibrationControl('start')">CAPTURE</button>
                    <button class="btn" onclick="vibrationStatus('NORMAL')">NORMAL</button>
                    <button class="btn" onclick="vibrationStatus('ABNORMAL')">ABNORMAL</button>
                    <button class="btn" onclick="vibrationStatus('IDLE')">IDLE</button>
                </div>
            </div>
            <div class="control-group">
                <div class="control-title">Observe</div>
                <div class="control-buttons">
                    <button class="btn" onclick="observeControl('left','FILLED')">L FILLED</button>
                    <button class="btn" onclick="observeControl('left','EMPTY')">L EMPTY</button>
                    <button class="btn" onclick="observeControl('right','FILLED')">R FILLED</button>
                    <button class="btn" onclick="observeControl('right','EMPTY')">R EMPTY</button>
                </div>
            </div>
            <div class="control-group">
                <div class="control-title">Collect</div>
                <div class="control-buttons">
                    <button class="btn" onclick="collectionControl('pot1','start')">P1 START</button>
                    <button class="btn" onclick="collectionControl('pot1','stop')">P1 STOP</button>
                    <button class="btn" onclick="collectionControl('pot2','start')">P2 START</button>
                    <button class="btn" onclick="collectionControl('pot2','stop')">P2 STOP</button>
                    <button class="btn" onclick="collectionControl('legacy','start')">ALL START</button>
                    <button class="btn" onclick="collectionControl('legacy','stop')">ALL STOP</button>
                </div>
            </div>
            <div class="control-group">
                <div class="control-title">MQTT</div>
                <div class="control-buttons">
                    <button class="btn" onclick="publishNow()">Publish</button>
                    <button class="btn" onclick="toggleMqttLog()">Log</button>
                    <button class="btn" onclick="toggleOpsLog()">Ops</button>
                    <button class="btn" onclick="toggleAppLog()">App</button>
                </div>
            </div>
            <div class="control-group">
                <div class="control-title">MQTT Quick</div>
                <div class="control-buttons">
                    <button class="btn" onclick="quickMqtt('observe_input_left')">OBS L 투입</button>
                    <button class="btn" onclick="quickMqtt('observe_input_right')">OBS R 투입</button>
                    <button class="btn" onclick="quickMqtt('frying_discharge_left')">FRY L DISCHARGE</button>
                    <button class="btn" onclick="quickMqtt('frying_discharge_right')">FRY R DISCHARGE</button>
                    <div class="mqtt-raw">
                        <input id="mqtt-topic" type="text" placeholder="topic">
                        <input id="mqtt-message" type="text" placeholder="message">
                        <button class="btn" onclick="publishMqttRaw()">SEND</button>
                        <span id="mqtt-send-result" class="muted">-</span>
                    </div>
                </div>
            </div>
            <div class="control-group">
                <div class="control-title">Overlay</div>
                <div class="control-buttons">
                    <button class="btn" onclick="overlayControl(true)">ON</button>
                    <button class="btn" onclick="overlayControl(false)">OFF</button>
                </div>
            </div>
            <div class="control-group">
                <div class="control-title">AI Snapshot</div>
                <div class="control-buttons">
                    <button class="btn" onclick="aiSnapshot(1)">SET 1 (0+2)</button>
                    <button class="btn" onclick="aiSnapshot(2)">SET 2 (1+3)</button>
                </div>
            </div>
        </div>
    </section>

    <section class="panel log-panel" id="mqtt-log" style="display:none;">
        <div class="section-label">MQTT 최근 메시지</div>
        <div class="log-list" id="mqtt-log-list">-</div>
    </section>

    <section class="panel log-panel" id="ops-log" style="display:none;">
        <div class="section-label">OPS 이벤트 로그</div>
        <div class="log-list" id="ops-log-list">-</div>
    </section>

    <section class="panel log-panel" id="app-log" style="display:none;">
        <div class="section-label">APP 실행 로그</div>
        <div class="log-list" id="app-log-list">-</div>
    </section>

    <section class="panel" id="snapshot-panel" style="display:none;">
        <div class="section-label">AI Snapshot</div>
        <div class="snapshot-grid">
            <div class="snapshot-box">
                <img id="snap-0" alt="snap-0">
                <div class="snapshot-metrics" id="snap-0-metrics">-</div>
            </div>
            <div class="snapshot-box">
                <img id="snap-1" alt="snap-1">
                <div class="snapshot-metrics" id="snap-1-metrics">-</div>
            </div>
        </div>
    </section>

    <section class="panel" id="vibration-panel">
        <div class="section-label">Vibration Live</div>
        <div class="snapshot-metrics" id="vibration-live-metrics">-</div>
    </section>

    <section class="panel" id="storage-panel">
        <div class="section-label">데이터 저장 위치</div>
        <div class="storage-list" id="storage-list">-</div>
    </section>

    <script>
        async function postJSON(url, data) {
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data || {})
                });
            } catch (e) {
                console.error('Request failed:', e);
            }
        }

        function relayControl(action) {
            postJSON('/api/control/relay', { action });
        }

        function vibrationControl(action) {
            postJSON('/api/control/vibration', { action });
        }

        function vibrationStatus(status) {
            postJSON('/api/control/vibration/status', { status });
        }

        function observeControl(side, status) {
            postJSON('/api/control/observe', { side, status });
        }

        function collectionControl(target, action) {
            postJSON('/api/control/collection', { target, action });
        }

        function publishNow() {
            postJSON('/api/control/publish', {});
        }

        async function quickMqtt(action) {
            try {
                const res = await fetch('/api/control/mqtt/quick', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });
                const data = await res.json();
                document.getElementById('mqtt-send-result').textContent =
                    data.ok ? `OK quick=${action}` : `FAIL quick=${action}`;
            } catch (e) {
                document.getElementById('mqtt-send-result').textContent = `FAIL quick=${action}`;
            }
        }

        async function publishMqttRaw() {
            const topic = (document.getElementById('mqtt-topic').value || '').trim();
            const message = document.getElementById('mqtt-message').value || '';
            if (!topic) {
                document.getElementById('mqtt-send-result').textContent = 'FAIL topic required';
                return;
            }
            try {
                const res = await fetch('/api/control/mqtt/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, message })
                });
                const data = await res.json();
                document.getElementById('mqtt-send-result').textContent =
                    data.ok ? `OK ${topic}` : `FAIL ${topic}`;
            } catch (e) {
                document.getElementById('mqtt-send-result').textContent = `FAIL ${topic}`;
            }
        }

        function overlayControl(enabled) {
            postJSON('/api/control/overlay', { enabled });
        }

        async function aiSnapshot(setId) {
            try {
                const res = await fetch(`/api/ai/snapshot?set=${setId}`);
                const data = await res.json();
                const panel = document.getElementById('snapshot-panel');
                panel.style.display = 'block';
                const camIds = setId === 1 ? ['0', '2'] : ['1', '3'];
                camIds.forEach((cid, idx) => {
                    const img = document.getElementById(`snap-${idx}`);
                    const metrics = document.getElementById(`snap-${idx}-metrics`);
                    const cam = data.cams[cid];
                    if (!cam || !cam.image) {
                        img.removeAttribute('src');
                        metrics.textContent = 'NO DATA';
                        return;
                    }
                    img.src = `data:image/jpeg;base64,${cam.image}`;
                    metrics.textContent = JSON.stringify(cam.metrics);
                });
            } catch (e) {
                console.error('Snapshot failed:', e);
            }
        }

        async function toggleMqttLog() {
            const box = document.getElementById('mqtt-log');
            if (box.style.display === 'none') {
                box.style.display = 'block';
                await refreshMqttLog();
            } else {
                box.style.display = 'none';
            }
        }

        async function toggleOpsLog() {
            const box = document.getElementById('ops-log');
            if (box.style.display === 'none') {
                box.style.display = 'block';
                await refreshOpsLog();
            } else {
                box.style.display = 'none';
            }
        }

        async function toggleAppLog() {
            const box = document.getElementById('app-log');
            if (box.style.display === 'none') {
                box.style.display = 'block';
                await refreshAppLog();
            } else {
                box.style.display = 'none';
            }
        }

        async function refreshMqttLog() {
            try {
                const res = await fetch('/api/mqtt/log');
                const data = await res.json();
                const list = document.getElementById('mqtt-log-list');
                list.innerHTML = data.slice(0, 20).map(item => {
                    const payload = (item.payload || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    return `<div class="log-item">[${item.timestamp}] <b>${item.topic}</b> ${payload}</div>`;
                }).join('') || '-';
            } catch (e) {
                console.error('MQTT log failed:', e);
            }
        }

        async function refreshOpsLog() {
            try {
                const res = await fetch('/api/ops/log?limit=30');
                const data = await res.json();
                const list = document.getElementById('ops-log-list');
                list.innerHTML = data.slice(0, 30).map(item => {
                    const ts = item.timestamp || '-';
                    const ev = item.event || '-';
                    const extra = { ...item };
                    delete extra.timestamp;
                    delete extra.event;
                    const payload = JSON.stringify(extra).replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    return `<div class="log-item">[${ts}] <b>${ev}</b> ${payload}</div>`;
                }).join('') || '-';
            } catch (e) {
                console.error('OPS log failed:', e);
            }
        }

        async function refreshAppLog() {
            try {
                const res = await fetch('/api/app/log?limit=40');
                const data = await res.json();
                const list = document.getElementById('app-log-list');
                list.innerHTML = data.slice(0, 40).map(item => {
                    const ts = item.timestamp || '-';
                    const level = item.level || 'INFO';
                    const message = (item.message || '-').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const extra = { ...item };
                    delete extra.timestamp;
                    delete extra.level;
                    delete extra.message;
                    const payload = Object.keys(extra).length
                        ? ` ${JSON.stringify(extra).replace(/</g, '&lt;').replace(/>/g, '&gt;')}`
                        : '';
                    return `<div class="log-item log-level-${level.toLowerCase()}">[${ts}] <b>${level}</b> ${message}${payload}</div>`;
                }).join('') || '-';
            } catch (e) {
                console.error('App log failed:', e);
            }
        }

        // ---- 카메라 상태 표시 (멈춤 감지) ----
        const CAM_NAMES = ['튀김 좌', '튀김 우', '바켓 좌', '바켓 우'];
        const STALL_WARN_SEC = 5;   // 주황: 새 프레임 없음 (잠깐 멈췄다가 스스로 돌아오는 경우 있음)
        let stallAlertSec = 30;     // 빨강 + 칩 리셋 경고 (config: camera_stall_alert_sec)
        let stallMessage = '';
        let statusFails = 0;
        let serverStarted = null;

        function formatDuration(sec) {
            sec = Math.floor(sec);
            if (sec < 60) return `${sec}초`;
            if (sec < 3600) return `${Math.floor(sec / 60)}분 ${sec % 60}초`;
            return `${Math.floor(sec / 3600)}시간 ${Math.floor((sec % 3600) / 60)}분`;
        }

        function formatClock(ts) {
            const d = new Date(ts * 1000);
            return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString() : d.toLocaleString();
        }

        function setPill(id, text, level) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.className = `pill pill-${level}`;
        }

        function updateCameraHealth(data) {
            const stalled = [];
            for (let i = 0; i < 4; i++) {
                const cam = data.cameras[`cam${i}`];
                if (!cam) {
                    setPill(`pill-${i}`, '비활성', 'idle');
                    continue;
                }
                const lastTs = cam.last_unique_frame_ts || 0;
                const stallSec = lastTs > 0 ? data.timestamp - lastTs : 0;
                if (lastTs === 0 && cam.alive === false) {
                    setPill(`pill-${i}`, '시작 실패', 'error');
                    stalled.push(`${CAM_NAMES[i]} 시작 실패`);
                } else if (lastTs === 0) {
                    setPill(`pill-${i}`, '대기', 'warn');
                } else if (stallSec >= stallAlertSec) {
                    setPill(`pill-${i}`, `멈춤 ${formatDuration(stallSec)}`, 'error');
                    stalled.push(`${CAM_NAMES[i]} 멈춤 ${formatDuration(stallSec)}`);
                } else if (stallSec >= STALL_WARN_SEC) {
                    setPill(`pill-${i}`, `변화 없음 ${formatDuration(stallSec)}`, 'warn');
                } else {
                    setPill(`pill-${i}`, `정상 ${cam.fps} fps`, 'ok');
                }
            }
            stallMessage = stalled.length > 0
                ? `카메라 이상 ${stalled.length}대 (${stalled.join(', ')}) — 칩 리셋으로 복구할 수 있습니다`
                : '';
            renderAlert();
        }

        function renderAlert() {
            // 카메라 이상 또는 복구 진행 중일 때 경고 줄 표시 (진행 중에는 버튼 대신 진행 상황만).
            // 릴레이 상태 조회는 읽기만 하므로 진행 중으로 표시하지 않음
            const box = document.getElementById('stall-alert');
            const busy = recoveryRequest !== null && recoveryRequest.action !== 'relay-status';
            const lost = busy && recoveryWebLost();
            box.hidden = !stallMessage && !busy;
            box.classList.toggle('alert-progress', busy && !lost);
            document.getElementById('stall-alert-text').textContent =
                lost ? '대시보드 서버 응답 없음' : (busy ? '카메라 복구 진행 중' : stallMessage);
            document.getElementById('alert-actions').hidden = busy;
            document.body.classList.toggle('has-alert', !box.hidden);
        }

        function markDisconnected() {
            // 웹 서비스 응답 없음(재시작/리셋 중): 마지막 값이 정상처럼 남아 있지 않게 표시
            for (let i = 0; i < 4; i++) {
                setPill(`pill-${i}`, '연결 끊김', 'idle');
                document.getElementById(`status-${i}`).textContent = '-';
            }
            stallMessage = '';
            renderAlert();
            const chip = document.getElementById('chip-updated');
            chip.textContent = '대시보드 연결 끊김';
            chip.className = 'chip chip-error';
            // MQTT 클라이언트도 웹 서비스 안에서 돌므로 연결 상태를 알 수 없음
            const mqttChip = document.getElementById('chip-mqtt');
            mqttChip.textContent = 'MQTT -';
            mqttChip.className = 'chip';
        }

        function showDeviceLabel(label) {
            // 장비 이름표 (설정 화면 '장비 이름표', 예: 울산 #2) — 비어 있으면 숨김
            const el = document.getElementById('device-label');
            const text = String(label || '').trim();
            el.textContent = text;
            el.hidden = !text;
            document.title = text ? `튀김 AI 모니터 · ${text}` : '튀김 AI 모니터';
        }

        function escapeHtml(text) {
            return String(text ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function loadStorage() {
            let items;
            try {
                const res = await fetch('/api/storage');
                items = await res.json();
            } catch (e) {
                return;  // 웹 재시작 중이면 다음 주기에 다시
            }
            let html = '';
            let group = '';
            for (const it of items) {
                if (it.group !== group) {
                    group = it.group;
                    html += `<div class="storage-group">${escapeHtml(group)}</div>`;
                }
                const missing = it.exists ? '' : '<span class="storage-missing">아직 없음</span>';
                let current = missing ? `<div class="storage-current">${missing}</div>` : '';
                if (it.current) {
                    // 위 폴더 경로와 겹치는 앞부분은 빼고 표시
                    const prefix = it.path.replace(/\/$/, '') + '/';
                    const rest = it.current.startsWith(prefix) ? it.current.slice(prefix.length) : it.current;
                    const label = it.current_kind === 'session' ? '기록 중' : '오늘';
                    current = `<div class="storage-current">${label}: <code>${escapeHtml(rest)}</code>${missing}</div>`;
                }
                html += `<div class="storage-row">
                    <div class="storage-label">${escapeHtml(it.label)}</div>
                    <div class="storage-body">
                        <code class="storage-path">${escapeHtml(it.path)}</code>
                        ${current}
                        <div class="storage-desc">${escapeHtml(it.desc)}</div>
                    </div>
                </div>`;
            }
            document.getElementById('storage-list').innerHTML = html;
        }

        async function loadDashboardConfig() {
            try {
                const res = await fetch('/api/config');
                const cfg = await res.json();
                const sec = Number(cfg.camera_stall_alert_sec);
                if (sec > 0) stallAlertSec = sec;
                showDeviceLabel(cfg.device_label);
            } catch (e) {
                // 기본값 유지
            }
        }

        async function updateStatus() {
            let data;
            try {
                const res = await fetch('/api/status');
                data = await res.json();
            } catch (e) {
                statusFails++;
                if (statusFails >= 2) markDisconnected();
                console.error('Status update failed:', e);
                return;
            }
            // 웹 서비스가 재시작됐으면(시작 시각 변경 / 연속 실패 후 복구) 카메라 스트림을 다시 연결
            const restarted = statusFails >= 2
                || (serverStarted !== null && data.server_started !== serverStarted);
            statusFails = 0;
            serverStarted = data.server_started;
            if (restarted) {
                reconnectCameras();
                refreshRecovery();
            }
            renderAutoRecovery(data.auto_recovery);

            try {
                for (let i = 0; i < 4; i++) {
                    const cam = data.cameras[`cam${i}`];
                    const elem = document.getElementById(`status-${i}`);
                    if (!cam) {
                        elem.textContent = 'Camera disabled';
                        continue;
                    }
                    elem.textContent = `FPS: ${cam.fps} | Frames: ${cam.frame_count} | Drops: ${cam.drop_count}`;
                }
                updateCameraHealth(data);

                if (data.frying.pot0) {
                    document.getElementById('status-0').textContent +=
                        ` | Lift: ${data.frying.pot0.lift_count || 0}`;
                }
                if (data.frying.pot1) {
                    document.getElementById('status-1').textContent +=
                        ` | Lift: ${data.frying.pot1.lift_count || 0}`;
                }

                const mqttChip = document.getElementById('chip-mqtt');
                mqttChip.textContent = `MQTT ${data.mqtt.connected ? '연결' : '끊김'}`;
                mqttChip.className = `chip ${data.mqtt.connected ? 'chip-ok' : 'chip-error'}`;
                const updatedChip = document.getElementById('chip-updated');
                updatedChip.textContent = `갱신 ${new Date(data.timestamp * 1000).toLocaleTimeString()}`;
                updatedChip.className = 'chip chip-plain';

                const parts = [];

                if (data.observe.cam2) {
                    document.getElementById('status-2').textContent +=
                        ` | ${data.observe.cam2.status || 'UNKNOWN'}`;
                }
                if (data.observe.cam3) {
                    document.getElementById('status-3').textContent +=
                        ` | ${data.observe.cam3.status || 'UNKNOWN'}`;
                }
                if (data.observe_state) {
                    const leftRaw = data.observe_state.left || 'UNKNOWN';
                    const rightRaw = data.observe_state.right || 'UNKNOWN';
                    const leftEff = data.observe_state.left_effective || leftRaw;
                    const rightEff = data.observe_state.right_effective || rightRaw;
                    document.getElementById('status-2').textContent += ` | RAW:${leftRaw} EFF:${leftEff}`;
                    document.getElementById('status-3').textContent += ` | RAW:${rightRaw} EFF:${rightEff}`;
                }
                if (data.safety_gate) {
                    const gl = data.safety_gate.left || {};
                    const gr = data.safety_gate.right || {};
                    const lGate = gl.gate || 'SAFE';
                    const rGate = gr.gate || 'SAFE';
                    document.getElementById('status-2').textContent += ` | GATE:${lGate} (${Number(gl.confidence || 0).toFixed(2)})`;
                    document.getElementById('status-3').textContent += ` | GATE:${rGate} (${Number(gr.confidence || 0).toFixed(2)})`;
                    parts.push(`GateL:${lGate} GateR:${rGate}`);
                }

                if (data.vibration && data.vibration.last_event && data.vibration.last_event.event) {
                    const ve = data.vibration.last_event;
                    const veTs = ve.timestamp ? ve.timestamp.split(' ').pop() : '-';
                    parts.push(`VibEvent: ${ve.event}(${ve.status || '-'}) @ ${veTs}`);
                }
                if (data.vibration && data.vibration.live) {
                    const live = data.vibration.live;
                    const measured = live.measured || {};
                    document.getElementById('vibration-live-metrics').textContent =
                        `samples=${live.total_samples || 0}\n` +
                        `freq_p99=(${Number(measured.freq_x_p99 || 0).toFixed(1)}, ${Number(measured.freq_y_p99 || 0).toFixed(1)}, ${Number(measured.freq_z_p99 || 0).toFixed(1)})\n` +
                        `vel_p99=(${Number(measured.vel_x_p99 || 0).toFixed(1)}, ${Number(measured.vel_y_p99 || 0).toFixed(1)}, ${Number(measured.vel_z_p99 || 0).toFixed(1)})`;
                }

                if (data.system && data.system.disk) {
                    const disk = data.system.disk;
                    const free = disk.total_gb - disk.used_gb;
                    const diskChip = document.getElementById('chip-disk');
                    diskChip.textContent = `Disk 여유 ${free.toFixed(1)} / ${disk.total_gb} GB`;
                    diskChip.className = `chip ${free < 10 ? 'chip-warn' : ''}`;
                }

                if (data.collection) {
                    const p1 = data.collection.pot1 ? 'ON' : 'OFF';
                    const p2 = data.collection.pot2 ? 'ON' : 'OFF';
                    const p1f = data.collection.pot1_frames || 0;
                    const p2f = data.collection.pot2_frames || 0;
                    const p1s = data.collection.pot1_session || '-';
                    const p2s = data.collection.pot2_session || '-';
                    document.getElementById('status-0').textContent +=
                        ` | COLLECT:${p1} (${p1f})`;
                    document.getElementById('status-1').textContent +=
                        ` | COLLECT:${p2} (${p2f})`;
                    parts.push(`S1:${p1s} S2:${p2s}`);
                }

                document.getElementById('status-bar').textContent = parts.join('  ·  ');
                if (document.getElementById('mqtt-log').style.display !== 'none') {
                    refreshMqttLog();
                }
                if (document.getElementById('ops-log').style.display !== 'none') {
                    refreshOpsLog();
                }
                if (document.getElementById('app-log').style.display !== 'none') {
                    refreshAppLog();
                }
            } catch (e) {
                console.error('Status render failed:', e);
            }
        }

        // ---- 카메라 복구 (칩 리셋 / 릴레이 상태) ----
        const RECOVERY_LABELS = {
            'reset': '칩 리셋',
            'reset-skip-relay': '칩 리셋 (릴레이 무시)',
            'relay-status': '릴레이 상태 조회',
        };
        const RECOVERY_IMPACT = '약 1분 동안 튀김/바켓 AI, MQTT 상태 전송, 대시보드가 멈추고 진행 중인 수집 세션이 끊깁니다.';
        const RECOVERY_CONFIRM = {
            'reset': `카메라 칩 리셋을 실행할까요?\n\n${RECOVERY_IMPACT}`,
            'reset-skip-relay': `릴레이 응답 없이 칩 리셋을 진행할까요?\n\n${RECOVERY_IMPACT}\n(릴레이가 동작하지 않으면 12V 차단 없이 I2C 리셋만 수행)`,
        };
        const RECOVERY_START_GRACE_SEC = 5;
        let recoveryRequest = null;  // 결과 확인 전인 작업 {action, at: 요청 시각(서버 기준)}
        let recoveryTimer = null;    // 상태 폴링 타이머는 하나만 유지
        let cooldownActive = false;  // 쿨다운 표시 중이면 조회가 한 번 실패해도 갱신을 이어감
        let recoveryDownSince = 0;   // 작업 추적 중 웹 응답이 끊기기 시작한 시각(ms)
        const RECOVERY_WEB_WAIT_MS = 600000;  // 리셋 최대 300초 + 중단 정리 90초 + 웹 재기동 여유

        function recoveryWebLost() {
            return recoveryDownSince > 0 && Date.now() - recoveryDownSince > RECOVERY_WEB_WAIT_MS;
        }

        function scheduleRecovery(ms) {
            clearTimeout(recoveryTimer);
            recoveryTimer = setTimeout(() => {
                recoveryTimer = null;
                refreshRecovery();
            }, ms);
        }

        let autoTriggerSeen = null;
        function renderAutoRecovery(ar) {
            const el = document.getElementById('auto-recovery-status');
            if (!ar) {
                el.textContent = '';
                return;
            }
            if (!ar.enabled) {
                el.textContent = '· 자동 복구 꺼짐';
                el.className = 'recovery-status';
            } else {
                el.textContent = ar.limited
                    ? `· 자동 복구 멈춤: ${ar.message}`
                    : `· 자동 복구 켜짐 (1시간 ${ar.recent_hour}/${ar.max_per_hour}회)`;
                el.className = `recovery-status ${ar.limited ? 'recovery-error' : ''}`;
            }
            // 자동 리셋이 새로 시작됐으면 진행 상황을 따라감 (다른 화면에서 누른 버튼과 같은 방식)
            if (autoTriggerSeen !== null && ar.last_trigger > autoTriggerSeen) {
                refreshRecovery();
            }
            autoTriggerSeen = ar.last_trigger;
        }

        function setRecoveryStatus(text, level) {
            for (const id of ['recovery-status', 'alert-recovery-status']) {
                const el = document.getElementById(id);
                el.textContent = text;
                el.className = `recovery-status ${level ? 'recovery-' + level : ''}`;
            }
        }

        function reconnectCameras() {
            document.querySelectorAll('.camera-box img').forEach(img => {
                const base = img.getAttribute('src').split('?')[0];
                img.src = `${base}?t=${Date.now()}`;
            });
        }

        async function recoveryStart(action) {
            if (RECOVERY_CONFIRM[action] && !confirm(RECOVERY_CONFIRM[action])) {
                return;
            }
            try {
                const res = await fetch(`/api/camera-recovery/${action}`, { method: 'POST' });
                const data = await res.json();
                if (!data.ok) {
                    setRecoveryStatus(`실패: ${data.message || data.error}`, 'error');
                    // 다른 작업이 실행 중이면 잠시 뒤 그 작업을 따라가 결과까지 표시
                    if (data.error === 'busy') scheduleRecovery(3000);
                    return;
                }
                recoveryRequest = { action, at: Number(data.requested_at) || 0 };
                setRecoveryStatus(`${RECOVERY_LABELS[action]} 시작...`, 'running');
                document.getElementById('recovery-log').style.display = 'block';
                renderAlert();
                scheduleRecovery(1000);
            } catch (e) {
                setRecoveryStatus('요청 실패', 'error');
            }
        }

        function describeRecoveryResult(last, log) {
            const label = RECOVERY_LABELS[last.action] || last.action;
            const when = last.finished ? formatClock(last.finished) : '-';
            if (last.status === 'success') {
                return [`${label}: 성공 (${when})`, 'ok'];
            }
            if (last.status === 'aborted') {
                let text = `${label}: 중단 — 변경 없음 (${when})`;
                // 릴레이 무응답 / 포트 없음 / 릴레이 스크립트 실패 (로그에 --skip-relay-check 안내가 남음)
                if (last.action === 'reset' && /\(no response\)|--skip-relay-check/.test(log || '')) {
                    text += ' · 릴레이 무응답/사용 불가 → \'칩 리셋 (릴레이 무시)\' 사용';
                }
                return [text, 'error'];
            }
            if (last.status === 'running') {
                return [`${label}: 비정상 종료 (결과 불명)`, 'error'];
            }
            return [`${label}: 실패 (${when})`, 'error'];
        }

        async function refreshRecovery() {
            let data;
            try {
                const res = await fetch('/api/camera-recovery/status');
                data = await res.json();
            } catch (e) {
                if (recoveryRequest) {
                    // 리셋 중에는 웹 서비스도 재시작되므로 응답이 끊기는 것이 정상 — 너무 오래 끊기면 안내
                    if (!recoveryDownSince) recoveryDownSince = Date.now();
                    if (recoveryWebLost()) {
                        setRecoveryStatus('복구 작업은 이미 끝났어야 함 — SSH로 jetson2-web 상태 확인', 'error');
                    } else if (recoveryRequest.action === 'relay-status') {
                        setRecoveryStatus('응답 대기 중...', 'running');
                    } else {
                        setRecoveryStatus('리셋 진행 중 (대시보드 재시작 대기)...', 'running');
                    }
                    renderAlert();
                    scheduleRecovery(2000);
                } else if (cooldownActive) {
                    scheduleRecovery(10000);  // 쿨다운 표시 갱신을 이어감
                }
                return;
            }
            recoveryDownSince = 0;
            cooldownActive = data.cooldown_left > 0;

            const logText = document.getElementById('recovery-log-text');
            logText.textContent = data.log || '-';
            logText.scrollTop = logText.scrollHeight;

            if (!data.installed) {
                setRecoveryStatus('미설치 — 젯슨에서 1회 실행: ./install_deser_control.sh', 'error');
                recoveryRequest = null;
                renderAlert();
                return;
            }
            if (data.running) {
                // 다른 화면/기기에서 시작한 작업도 끝날 때까지 추적 (실제로 실행 중인 작업을 따라감)
                if (!recoveryRequest || recoveryRequest.action !== data.running) {
                    recoveryRequest = { action: data.running, at: recoveryRequest ? recoveryRequest.at : 0 };
                }
                setRecoveryStatus(`${RECOVERY_LABELS[data.running] || data.running} 실행 중...`, 'running');
                renderAlert();
                scheduleRecovery(2000);
                return;
            }

            const last = data.last || {};
            if (recoveryRequest) {
                const req = recoveryRequest;
                // 요청 이후에 시작된 실행이면 (다른 기기에서 시작한 작업이라도) 그 결과를 표시
                const isResult = Number(last.started || 0) >= req.at - 2;
                if (!isResult) {
                    // 아직 시작 전이거나, 시작하자마자 실패해 새 결과를 남기지 못한 경우
                    if (data.timestamp - req.at < RECOVERY_START_GRACE_SEC) {
                        scheduleRecovery(1000);
                        return;
                    }
                    recoveryRequest = null;
                    renderAlert();
                    setRecoveryStatus(
                        `${RECOVERY_LABELS[req.action] || req.action}: 시작 실패 — journalctl -u deser-control@${req.action} 확인`,
                        'error');
                    return;
                }
                recoveryRequest = null;
                renderAlert();
            }
            if (last.action) {
                let [text, level] = describeRecoveryResult(last, data.log);
                if (data.cooldown_left > 0) {
                    text += ` | 칩 리셋 재시도 ${data.cooldown_left}초 후`;
                    scheduleRecovery(10000);  // 남은 쿨다운 표시 갱신
                }
                setRecoveryStatus(text, level);
            }
        }

        function toggleRecoveryLog() {
            const box = document.getElementById('recovery-log');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
            if (box.style.display === 'block') {
                refreshRecovery();
            }
        }

        loadDashboardConfig();
        loadStorage();
        setInterval(loadStorage, 10000);  // 수집 시작·종료와 날짜 변경 반영
        setInterval(updateStatus, 2000);
        updateStatus();
        refreshRecovery();
    </script>
</body>
</html>
